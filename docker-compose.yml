services:
  postgres:
    image: postgres:16-alpine
    container_name: english-center-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: english_center_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d english_center_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: english-center-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: english-center-api-migrate
    command: ["npm", "run", "migrate:deploy", "--workspace=database"]
    environment:
      DATABASE_URL: "postgresql://admin:password@postgres:5432/english_center_db?schema=public"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-seed:
    image: postgres:16-alpine
    container_name: english-center-db-seed
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: english_center_db
      DATA_DUMP_FILE: /docker-entrypoint-initdata/local-data-dump.sql
      BRANDING_LOGO_FILE: /docker-entrypoint-initdata/branding-logo.png
      BRANDING_LOGO_TARGET: /app/uploads/branding/logo-1777865698688-670336801.png
    volumes:
      - ./local-data-dump.sql:/docker-entrypoint-initdata/local-data-dump.sql:ro
      - ./apps/api/uploads/branding/logo-eg.png:/docker-entrypoint-initdata/branding-logo.png:ro
      - ./docker/postgres/import-local-data.sh:/docker-entrypoint-initdata/import-local-data.sh:ro
      - branding_data:/app/uploads
    command: ["sh", "/docker-entrypoint-initdata/import-local-data.sh"]
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: english-center-api
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: "postgresql://admin:password@postgres:5432/english_center_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "supersecret"
      JWT_REFRESH_SECRET: "superrefreshsecret"
      FRONTEND_URL: "http://localhost:3001"
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: "lax"
      NODE_ENV: "development"
    volumes:
      - branding_data:/app/uploads
    depends_on:
      db-seed:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: english-center-web
    ports:
      - "3002:3001"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
      API_SERVER_URL: "http://api:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  branding_data:
